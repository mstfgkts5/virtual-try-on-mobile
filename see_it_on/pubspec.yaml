name: see_it_on
description: "SeeItOn - yerel yapay zeka (CatVTON) destekli sanal kabin uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^1.10.3
  image_picker: ^1.2.3
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Flutter alt klasörleri otomatik eklemez; her klasör ayrı yazılmalı
  assets:
    - assets/images/
    - assets/images/mannequins/
    - assets/images/garments/