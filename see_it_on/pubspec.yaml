name: see_it_on
description: "SeeItOn - yerel yapay zeka (CatVTON) destekli sanal kabin uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^1.10.3
  image_picker: ^1.2.3
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  gal: ^2.3.3
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # lib/l10n/*.arb -> AppLocalizations

  # Flutter alt klasörleri otomatik eklemez; her klasör ayrı yazılmalı
  assets:
    - assets/images/
    - assets/images/mannequins/
    - assets/images/garments/

  # Dergi tarzı tipografi (SIL Open Font License, lisanslar assets/fonts/OFL-*.txt).
  # Statik ağırlık dosyaları: FontWeight her platformda doğru dosyayı seçer.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600